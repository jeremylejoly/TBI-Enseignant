<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semainier P5-P6 — 2 Menus Déroulants & Couleurs FWB</title>
<style>
:root {
  --primary: #1e293b;
  --primary-dark: #0f172a;
  --accent: #2563eb;
  --bg: #f1f5f9;
  --card-bg: #ffffff;
  --border: #cbd5e1;
  --border-strong: #1e293b;
  --text: #0f172a;
  --muted: #64748b;
  
  /* Disciplines Colors */
  --math-bg: #eff6ff; --math-border: #3b82f6; --math-text: #1d4ed8;
  --fr-bg: #f0fdf4;   --fr-border: #22c55e; --fr-text: #15803d;
  --sci-bg: #ecfeff;  --sci-border: #06b6d4; --sci-text: #0e7490;
  --hist-bg: #fffbeb; --hist-border: #f59e0b; --hist-text: #b45309;
  --eco-bg: #f5f3ff;  --eco-border: #8b5cf6; --eco-text: #6d28d9;
  --fmttn-bg: #fdf2f8;--fmttn-border: #ec4899;--fmttn-text: #be185d;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background-color: var(--bg);
  color: var(--text);
  line-height: 1.35;
  padding: 14px;
  font-size: 13px;
}

/* Header & Controls */
.app-header {
  background: white;
  border-radius: 12px;
  padding: 12px 18px;
  margin-bottom: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.app-title-group {
  display: flex;
  align-items: center;
  gap: 12px;
}

.app-badge {
  background: #1e293b;
  color: white;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 8px;
  border-radius: 6px;
  letter-spacing: 0.5px;
}

.app-title {
  font-size: 17px;
  font-weight: 800;
  color: var(--primary-dark);
}

.app-subtitle {
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
}

.toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--border);
  background: white;
  color: var(--text);
  transition: all 0.15s ease;
}

.btn:hover {
  background: #f8fafc;
  border-color: #94a3b8;
}

.btn-primary {
  background: #2563eb;
  color: white;
  border-color: #1d4ed8;
}
.btn-primary:hover {
  background: #1d4ed8;
}

.btn-success {
  background: #16a34a;
  color: white;
  border-color: #15803d;
}
.btn-success:hover {
  background: #15803d;
}

.btn-danger {
  background: white;
  color: #dc2626;
  border-color: #fca5a5;
}
.btn-danger:hover {
  background: #fee2e2;
  border-color: #ef4444;
}

select.form-control, input.form-control {
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  font-size: 13px;
  background: white;
  color: var(--text);
  outline: none;
}
select.form-control:focus, input.form-control:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(37,99,235,0.2);
}

.view-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}

/* Semainier Table Container */
.schedule-container {
  background: white;
  border-radius: 12px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.06);
  border: 2px solid var(--border-strong);
  overflow-x: auto;
  position: relative;
}

.schedule-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  min-width: 1150px;
}

.schedule-table th, .schedule-table td {
  border: 1.5px solid var(--border-strong);
  vertical-align: top;
}

.schedule-table th {
  background: #f8fafc;
  padding: 10px 8px;
  text-align: center;
  font-weight: 800;
  font-size: 13px;
  color: var(--primary-dark);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.schedule-table th.col-time {
  width: 100px;
  background: #f1f5f9;
}

.time-header-cell {
  background: #f8fafc;
  text-align: center;
  padding: 6px 4px;
  font-weight: 700;
  font-size: 11px;
  color: var(--muted);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100%;
}
.time-header-cell.course {
  min-height: 140px;
}
.time-header-cell.recreation, .time-header-cell.midi {
  min-height: 26px;
  height: 26px;
  padding: 2px 4px;
  font-size: 10px;
}
.time-header-cell .period-idx {
  font-size: 10px;
  text-transform: uppercase;
  color: #94a3b8;
  margin-bottom: 2px;
}
.time-header-cell .period-time {
  color: #1e293b;
  font-weight: 700;
}

/* Cell Structure (3 Elements + Color Options) */
.period-cell {
  height: 100%;
  min-height: 140px;
  display: flex;
  flex-direction: column;
  background: white;
  position: relative;
  padding: 6px;
  gap: 5px;
  transition: background-color 0.15s ease;
}

/* 1. Zone de texte libre */
.period-activity-input {
  width: 100%;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  padding: 6px 8px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  color: #0f172a;
  resize: vertical;
  min-height: 48px;
  background: rgba(255, 255, 255, 0.85);
  transition: all 0.15s ease;
  line-height: 1.35;
}
.period-activity-input:focus {
  outline: none;
  border-color: var(--accent);
  background: #ffffff;
  box-shadow: 0 0 0 2px rgba(37,99,235,0.15);
}
.period-activity-input::placeholder {
  color: #94a3b8;
  font-weight: 400;
  font-style: italic;
  font-size: 11px;
}

/* 2 & 3. Deux Menus Déroulants Directs */
.dropdown-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-top: auto;
}

.fwb-select {
  width: 100%;
  padding: 4px 6px;
  border-radius: 6px;
  border: 1px solid #cbd5e1;
  font-size: 11px;
  font-weight: 500;
  outline: none;
  background-color: rgba(255, 255, 255, 0.9);
  color: #1e293b;
  cursor: pointer;
  transition: all 0.15s ease;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.fwb-select:focus {
  border-color: var(--accent);
  background: #ffffff;
  box-shadow: 0 0 0 2px rgba(37,99,235,0.15);
}

.fwb-select.comp-select {
  font-weight: 700;
  border-left: 3.5px solid #94a3b8;
}

.fwb-select.attendu-select {
  border-style: solid;
  font-size: 10.5px;
  color: #334155;
}

.fwb-select:disabled {
  background-color: rgba(241, 245, 249, 0.7);
  color: #94a3b8;
  border-color: #e2e8f0;
  cursor: not-allowed;
  font-style: italic;
}

/* Cell footer actions */
.cell-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 2px;
  font-size: 10px;
}
.cell-action-group {
  display: flex;
  align-items: center;
  gap: 3px;
}
.cell-btn {
  background: none;
  border: 1px solid transparent;
  color: #64748b;
  cursor: pointer;
  font-size: 10px;
  padding: 2px 5px;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  transition: all 0.15s;
}
.cell-btn:hover {
  background: #e2e8f0;
  color: #0f172a;
  border-color: #cbd5e1;
}
.cell-btn.clear-btn:hover {
  background: #fee2e2;
  color: #dc2626;
  border-color: #fca5a5;
}

/* Floating Color Palette Toolbar (like in TBI) */
#horaire-color-popover {
  position: absolute;
  background: white;
  border: 2px solid #1e293b;
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.18);
  padding: 10px 12px;
  z-index: 1000;
  display: none;
  flex-direction: column;
  gap: 8px;
  animation: popIn 0.12s ease-out;
}

@keyframes popIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

.palette-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.palette-row-title {
  font-size: 9px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #64748b;
}
.color-swatches {
  display: flex;
  gap: 5px;
  align-items: center;
}
.color-swatch {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid #1e293b;
  cursor: pointer;
  transition: transform 0.1s, box-shadow 0.1s;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.color-swatch:hover {
  transform: scale(1.18);
  box-shadow: 0 2px 6px rgba(0,0,0,0.25);
}
.color-swatch.swatch-none {
  background: white;
  border-color: #cbd5e1;
  font-size: 11px;
  font-weight: bold;
  color: #64748b;
}

/* Special Fixed Row Types (Recreation, Midi) */
.row-special {
  height: 28px !important;
}
.special-row {
  background: #f8fafc;
  text-align: center;
  font-weight: 800;
  letter-spacing: 6px;
  color: #475569;
  font-size: 11px;
  padding: 3px 6px !important;
  vertical-align: middle !important;
  user-select: none;
  height: 28px !important;
  line-height: 1.2;
}
.special-row.midi {
  background: #f1f5f9;
  color: #334155;
}
.disabled-slot {
  background: repeating-linear-gradient(
    45deg,
    #f8fafc,
    #f8fafc 10px,
    #e2e8f0 10px,
    #e2e8f0 20px
  );
  opacity: 0.6;
}

/* Preset Fixed Subject Block */
.preset-block {
  background: #fce7f3;
  color: #9d174d;
  font-weight: 700;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  min-height: 140px;
  padding: 10px;
  border-radius: 6px;
  border: 1px dashed #f472b6;
  position: relative;
}
.preset-block.allemand {
  background: #fef3c7;
  color: #92400e;
  border-color: #fcd34d;
}
.preset-block.gym {
  background: #ffe4e6;
  color: #9f1239;
  border-color: #fda4af;
}
.preset-block.cpc {
  background: #ede9fe;
  color: #5b21b6;
  border-color: #c4b5fd;
}
.preset-block.libre {
  background: #f1f5f9;
  color: #475569;
  border-color: #cbd5e1;
}
.preset-block-actions {
  position: absolute;
  top: 4px;
  right: 4px;
  display: flex;
  gap: 2px;
}
.preset-block-btn {
  background: rgba(255,255,255,0.85);
  border: 1px solid rgba(0,0,0,0.15);
  border-radius: 4px;
  font-size: 9.5px;
  padding: 2px 5px;
  cursor: pointer;
}
.preset-block-btn:hover {
  background: white;
}

/* Quick Filter by Year */
.year-pills {
  display: flex;
  gap: 4px;
}
.year-pill {
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
  border: 1px solid var(--border);
  background: white;
}
.year-pill.active {
  background: #0f172a;
  color: white;
  border-color: #0f172a;
}

/* Print Styling */
@media print {
  body {
    background: white;
    padding: 0;
    font-size: 9.5px;
  }
  .app-header, .toolbar, .cell-footer, .preset-block-actions, #horaire-color-popover {
    display: none !important;
  }
  .schedule-container {
    box-shadow: none;
    border: 1.5px solid black;
  }
  .schedule-table th, .schedule-table td {
    border: 1px solid black !important;
  }
  .period-activity-input {
    border: none !important;
    padding: 0 !important;
    background: transparent !important;
    font-size: 10px !important;
    resize: none !important;
    min-height: auto !important;
    font-weight: 700 !important;
  }
  .fwb-select {
    border: none !important;
    background: transparent !important;
    padding: 0 !important;
    font-size: 8.5px !important;
    appearance: none !important;
    -webkit-appearance: none !important;
  }
  @page {
    size: A4 landscape;
    margin: 6mm;
  }
}
</style>
</head>
<body>

<!-- Header -->
<header class="app-header">
  <div class="header-top">
    <div class="app-title-group">
      <h1 class="app-title">Mon semainier</h1>
    </div>

    <!-- Toolbar controls -->
    <div class="toolbar">
      <label style="font-weight:700; font-size:12px; color:#475569;">Semaine :</label>
      <select id="week-selector" class="form-control" onchange="changeActiveWeek(this.value)">
        <!-- populated dynamically -->
      </select>
      
      <button class="btn btn-primary" onclick="createNewWeek()">＋ Nouvelle semaine</button>
      <button class="btn" onclick="duplicateCurrentWeek()">📑 Dupliquer</button>
      <button class="btn" onclick="renameCurrentWeek()">✏️ Renommer</button>
      <button class="btn btn-danger" onclick="deleteCurrentWeek()">🗑️ Supprimer</button>
      
      <div class="view-controls">
        <button class="btn btn-success" onclick="window.print()">🖨️ Imprimer / PDF</button>
        <button class="btn" onclick="exportDataJSON()">💾 Exporter JSON</button>
        <button class="btn" onclick="document.getElementById('import-file').click()">📂 Importer JSON</button>
        <input type="file" id="import-file" style="display:none" accept=".json" onchange="importDataJSON(event)">
      </div>
    </div>
  </div>

  <!-- Filter bar -->
  <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; padding-top:4px; border-top:1px solid #e2e8f0;">
    <div style="display:flex; align-items:center; gap:8px;">
      <span style="font-size:11px; font-weight:700; color:#64748b;">Filtre des attendus par cycle :</span>
      <div class="year-pills">
        <button class="year-pill active" id="pill-all" onclick="setCycleFilter('all')">Tous (P5 &amp; P6)</button>
        <button class="year-pill" id="pill-p5" onclick="setCycleFilter('P5')">P5 seulement</button>
        <button class="year-pill" id="pill-p6" onclick="setCycleFilter('P6')">P6 seulement</button>
      </div>
    </div>
    <span style="font-size:11px; color:#64748b; font-style:italic;">🎨 Cliquez sur le bouton "🎨 Couleurs" de chaque case pour personnaliser le fond et l'écriture.</span>
  </div>
</header>

<!-- Main Table Container -->
<div class="schedule-container" id="schedule-container">
  <table class="schedule-table" id="schedule-table">
    <thead>
      <tr>
        <th class="col-time">Heures</th>
        <th>Lundi</th>
        <th>Mardi</th>
        <th>Mercredi</th>
        <th>Jeudi</th>
        <th>Vendredi</th>
      </tr>
    </thead>
    <tbody id="schedule-tbody">
      <!-- Generated dynamically -->
    </tbody>
  </table>

  <!-- Floating Color Palette Popover -->
  <div id="horaire-color-popover">
    <!-- Background Color Row -->
    <div class="palette-row">
      <span class="palette-row-title">Couleur de fond du cadre</span>
      <div class="color-swatches">
        <button class="color-swatch swatch-none" onclick="applyPopoverBg('')" title="Blanc / Par défaut">✕</button>
        <button class="color-swatch" style="background-color: #E0E7FF;" onclick="applyPopoverBg('#E0E7FF')" title="Bleu pastel"></button>
        <button class="color-swatch" style="background-color: #D1FAE5;" onclick="applyPopoverBg('#D1FAE5')" title="Vert pastel"></button>
        <button class="color-swatch" style="background-color: #FEF3C7;" onclick="applyPopoverBg('#FEF3C7')" title="Jaune pastel"></button>
        <button class="color-swatch" style="background-color: #FFE4E6;" onclick="applyPopoverBg('#FFE4E6')" title="Rose/Rouge pastel"></button>
        <button class="color-swatch" style="background-color: #F5F3FF;" onclick="applyPopoverBg('#F5F3FF')" title="Violet pastel"></button>
        <button class="color-swatch" style="background-color: #CFFAFE;" onclick="applyPopoverBg('#CFFAFE')" title="Cyan pastel"></button>
        <button class="color-swatch" style="background-color: #FFEDD5;" onclick="applyPopoverBg('#FFEDD5')" title="Orange pastel"></button>
      </div>
    </div>
    <!-- Text Color Row -->
    <div class="palette-row">
      <span class="palette-row-title">Couleur de l'écriture ("Ce que je fais")</span>
      <div class="color-swatches">
        <button class="color-swatch" style="background-color: #0F172A;" onclick="applyPopoverTextColor('#0F172A')" title="Noir / Défaut"></button>
        <button class="color-swatch" style="background-color: #1D4ED8;" onclick="applyPopoverTextColor('#1D4ED8')" title="Bleu"></button>
        <button class="color-swatch" style="background-color: #15803D;" onclick="applyPopoverTextColor('#15803D')" title="Vert"></button>
        <button class="color-swatch" style="background-color: #B45309;" onclick="applyPopoverTextColor('#B45309')" title="Orange/Marron"></button>
        <button class="color-swatch" style="background-color: #BE123C;" onclick="applyPopoverTextColor('#BE123C')" title="Rouge"></button>
        <button class="color-swatch" style="background-color: #6D28D9;" onclick="applyPopoverTextColor('#6D28D9')" title="Violet"></button>
        <button class="color-swatch swatch-none" onclick="applyPopoverTextColor('')" title="Réinitialiser">↺</button>
      </div>
    </div>
  </div>
</div>

<script>
// =========================================================================
// 1. BASE DE DONNÉES COMPLÈTE & OFFICIELLE FWB (P5 - P6)
// =========================================================================
const FWB_DATABASE = {
  "math": {
    "name": "Mathématiques",
    "icon": "📐",
    "color": "#2563eb",
    "bg": "#eff6ff",
    "border": "#3b82f6",
    "text": "#1d4ed8",
    "competencies": [
      {
        "id": "math_geo_rep",
        "name": "1.1 Géométrie — Repérage & déplacements (Plans, quadrillages, repères cardinaux)",
        "attendus": [
          {
            "cycle": "P5",
            "text": "Utiliser le vocabulaire des positions absolues et relatives (devant, derrière, droite, gauche, au-dessus, autour de...)"
          },
          {
            "cycle": "P5",
            "text": "Tracer sur un plan élaboré selon un quadrillage codé un itinéraire respectant au moins 4 points de repère"
          },
          {
            "cycle": "P5-P6",
            "text": "Se déplacer dans l'espace 3D en suivant un trajet donné sur un plan"
          },
          {
            "cycle": "P6",
            "text": "Verbaliser la position d'un objet ou un itinéraire en utilisant les 8 repères cardinaux"
          }
        ]
      },
      {
        "id": "math_geo_fig",
        "name": "1.2 Géométrie — Figures planes & Propriétés (Triangles, quadrilatères, cercles, polygones)",
        "attendus": [
          {
            "cycle": "P5",
            "text": "Identifier les quadrilatères : carré, rectangle, losange, parallélogramme, trapèze (isocèle, rectangle)"
          },
          {
            "cycle": "P5",
            "text": "Identifier les triangles : acutangle, rectangle, obtusangle, scalène, isocèle, équilatéral"
          },
          {
            "cycle": "P5",
            "text": "Identifier le cercle et ses composantes : centre, rayon, diamètre, corde"
          },
          {
            "cycle": "P5",
            "text": "Identifier angle aigu, droit, obtus et angles isométriques"
          },
          {
            "cycle": "P5",
            "text": "Énoncer les caractéristiques des côtés et angles des quadrilatères et triangles"
          },
          {
            "cycle": "P5",
            "text": "Symbolisme : A (point), a (droite), [AB] (segment), // (parallèles), ⊥ (perpendiculaires)"
          },
          {
            "cycle": "P6",
            "text": "Identifier les polygones réguliers : pentagone, hexagone, octogone, décagone"
          }
        ]
      },
      {
        "id": "math_geo_traces",
        "name": "1.3 Géométrie — Tracés de figures & Constructions (Triangles, quadrilatères, compas, latte/équerre)",
        "attendus": [
          {
            "cycle": "P5",
            "text": "Tracer un triangle à la latte et l'équerre (avec et sans contraintes, sur papier tramé et vierge)"
          },
          {
            "cycle": "P5",
            "text": "Tracer un quadrilatère à la latte et l'équerre (avec et sans contraintes, sur papier tramé et vierge)"
          },
          {
            "cycle": "P5",
            "text": "Tracer un losange inscrit dans un rectangle (et un rectangle à partir d'un losange)"
          },
          {
            "cycle": "P5",
            "text": "Tracer des droites perpendiculaires (⊥) et parallèles (//) à la latte et l'équerre"
          },
          {
            "cycle": "P5-P6",
            "text": "Tracer au compas un cercle, un triangle isocèle et un triangle équilatéral"
          },

    const popover = document.getElementById("horaire-color-popover");
    if (popover && popover.style.display === "flex") {
      if (!popover.contains(e.target) && !e.target.closest(".color-trigger-btn")) {
        closeColorPopover();
      }
    }
  });
});

function getStorageKey() {
  return "tbi_fwb_semainier_v7";
}

function createBlankGrid() {
  const grid = {};
  TIME_SLOTS.forEach((slot, rIdx) => {
    grid[rIdx] = {};
    DAYS.forEach((day, cIdx) => {
      if (slot.type === "course") {
        if (cIdx === 2 && rIdx >= 6) {
          // Mercredi après-midi libre
          grid[rIdx][cIdx] = { type: "disabled" };
        } else {
          grid[rIdx][cIdx] = {
            type: "course",
            activity: "",
            compId: "",
            attenduText: "",
            bg: "",
            textColor: ""
          };
        }
      } else {
        grid[rIdx][cIdx] = { type: slot.type };
      }
    });
  });
  return grid;
}

function loadData() {
  const raw = localStorage.getItem(getStorageKey());
  if (raw) {
    try {
      allWeeks = JSON.parse(raw);
    } catch (e) {
      allWeeks = [];
    }
  }
  
  // Assurer la présence du modèle permanent
  let templateWeek = allWeeks.find(w => w.isTemplate);
  if (!templateWeek) {
    templateWeek = {
      id: "template_model",
      isTemplate: true,
      title: "Grille Modèle (Canevas de base)",
      created: new Date().toISOString(),
      grid: createBlankGrid()
    };
    allWeeks.unshift(templateWeek);
  }

  if (allWeeks.length === 1) {
    // Créer une première semaine de cours basée sur le modèle
    const firstWeek = {
      id: "week_" + Date.now(),
      isTemplate: false,
      title: "Semaine 1",
      created: new Date().toISOString(),
      grid: JSON.parse(JSON.stringify(templateWeek.grid))
    };
    allWeeks.push(firstWeek);
    activeWeekId = templateWeek.id;
    saveData();
  } else {
    activeWeekId = allWeeks[0].id;
  }
}

function saveData() {
  localStorage.setItem(getStorageKey(), JSON.stringify(allWeeks));
}

function getActiveWeek() {
  return allWeeks.find(w => w.id === activeWeekId) || allWeeks[0];
}

function getTemplateWeek() {
  return allWeeks.find(w => w.isTemplate) || allWeeks[0];
}

function getNextMondayString() {
  let latestMonday = null;
  
  allWeeks.forEach(w => {
    if (!w.isTemplate && w.title && w.title.startsWith("Semaine du ")) {
      const dateStr = w.title.substring("Semaine du ".length).trim();
      const parts = dateStr.split('/');
      if (parts.length >= 3) {
        const day = parseInt(parts[0], 10);
        const month = parseInt(parts[1], 10) - 1;
        let year = parseInt(parts[2], 10);
        if (year < 100) year += 2000;
        
        const monday = new Date(year, month, day);
        if (!isNaN(monday.getTime())) {
          if (!latestMonday || monday > latestMonday) {
            latestMonday = monday;
          }
        }
      }
    }
  });

  let newMonday;
  if (latestMonday) {
    newMonday = new Date(latestMonday);
    newMonday.setDate(latestMonday.getDate() + 7);
  } else {
    const today = new Date();
    const dayOfWeek = today.getDay();
    const daysUntilNextMonday = (8 - dayOfWeek) % 7 || 7;
    newMonday = new Date(today);
    newMonday.setDate(today.getDate() + daysUntilNextMonday);
  }
  
  const day = String(newMonday.getDate()).padStart(2, '0');
  const month = String(newMonday.getMonth() + 1).padStart(2, '0');
  const year = String(newMonday.getFullYear()).slice(-2);
  return `Semaine du ${day}/${month}/${year}`;
}

// =========================================================================
// 3. RENDU DU SEMAINIER (2 SELECTS + COULEURS DE FOND & TEXTE)
// =========================================================================
function renderWeekSelector() {
  const select = document.getElementById("week-selector");
  select.innerHTML = "";

  const templateWeek = getTemplateWeek();
  const normalWeeks = allWeeks.filter(w => !w.isTemplate);

  // 1. Groupe Modèle permanent
  const grpModel = document.createElement("optgroup");
  grpModel.label = "⭐ Canevas permanent";
  const optModel = document.createElement("option");
  optModel.value = templateWeek.id;
  optModel.textContent = "📋 " + templateWeek.title;
  if (templateWeek.id === activeWeekId) optModel.selected = true;
  grpModel.appendChild(optModel);
  select.appendChild(grpModel);

  // 2. Groupe Semaines normales
  const grpWeeks = document.createElement("optgroup");
  grpWeeks.label = "📅 Mes Semaines de cours (" + normalWeeks.length + ")";
  normalWeeks.forEach(w => {
    const opt = document.createElement("option");
    opt.value = w.id;
    opt.textContent = "🗓️ " + w.title;
    if (w.id === activeWeekId) opt.selected = true;
    grpWeeks.appendChild(opt);
  });
  select.appendChild(grpWeeks);
}

function changeActiveWeek(weekId) {
  activeWeekId = weekId;
  closeColorPopover();
  renderSchedule();
}

function setCycleFilter(cycle) {
  currentCycleFilter = cycle;
  document.getElementById("pill-all").classList.toggle("active", cycle === "all");
  document.getElementById("pill-p5").classList.toggle("active", cycle === "P5");
  document.getElementById("pill-p6").classList.toggle("active", cycle === "P6");
  renderSchedule();
}

function renderSchedule() {
  const currentWeek = getActiveWeek();
  const tbody = document.getElementById("schedule-tbody");
  tbody.innerHTML = "";

  TIME_SLOTS.forEach((slot, rIdx) => {
    const tr = document.createElement("tr");
    if (slot.type === "recreation" || slot.type === "midi") {
      tr.className = "row-special";
    }

    // Colonne Heures
    const timeTd = document.createElement("td");
    timeTd.className = `time-header-cell ${slot.type}`;
    if (slot.type === "recreation" || slot.type === "midi") {
      timeTd.innerHTML = `<span class="period-time" style="font-size:10px;">${slot.time}</span>`;
    } else {
      timeTd.innerHTML = `
        <span class="period-idx">${slot.label}</span>
        <span class="period-time">${slot.time}</span>
      `;
    }
    tr.appendChild(timeTd);

    if (slot.type === "recreation" || slot.type === "midi") {
      const specTd = document.createElement("td");
      specTd.colSpan = 5;
      specTd.className = `special-row ${slot.type}`;
      specTd.textContent = slot.label;
      tr.appendChild(specTd);
    } else {
      DAYS.forEach((day, cIdx) => {
        const td = document.createElement("td");
        const cellData = (currentWeek.grid[rIdx] && currentWeek.grid[rIdx][cIdx]) || { 
          type: "course", activity: "", compId: "", attenduText: "", bg: "", textColor: "" 
        };

        if (cellData.type === "disabled") {
          td.className = "disabled-slot";
          td.innerHTML = `<div style="text-align:center; padding:30px 0; color:#94a3b8; font-style:italic; font-size:11px;">Après-midi libre</div>`;
        } else if (cellData.type === "preset") {
          const bgStyle = cellData.bg ? `background-color:${cellData.bg};` : '';
          const textStyle = cellData.textColor ? `color:${cellData.textColor};` : '';
          td.innerHTML = `
            <div class="preset-block ${cellData.presetType || ''}" style="${bgStyle} ${textStyle}">
              <div class="preset-block-actions">
                <button class="preset-block-btn color-trigger-btn" title="Changer les couleurs" onclick="openColorPopover(event, ${rIdx}, ${cIdx})">🎨</button>
                <button class="preset-block-btn" title="Convertir en période FWB" onclick="convertToCourseSlot(${rIdx}, ${cIdx})">✏️ Éditer</button>
              </div>
              <div>${cellData.label || 'Fixe'}</div>
            </div>
          `;
        } else {
          td.appendChild(createDirectSelectCellElement(rIdx, cIdx, cellData));
        }

        tr.appendChild(td);
      });
    }

    tbody.appendChild(tr);
  });
}

function createDirectSelectCellElement(rIdx, cIdx, cellData) {
  const container = document.createElement("div");
  container.className = "period-cell";

  // Apply custom background color if set
  if (cellData.bg) {
    container.style.backgroundColor = cellData.bg;
  }

  // 1. Zone de texte libre (avec couleur de texte personnalisée)
  const textarea = document.createElement("textarea");
  textarea.className = "period-activity-input";
  textarea.placeholder = "Ce que je fais (titre, activités, manuel...)";
  textarea.value = cellData.activity || "";
  if (cellData.textColor) {
    textarea.style.color = cellData.textColor;
  }
  textarea.addEventListener("input", (e) => {
    cellData.activity = e.target.value;
    saveData();
  });
  container.appendChild(textarea);

  // Group des 2 menus déroulants
  const dropdownGroup = document.createElement("div");
  dropdownGroup.className = "dropdown-group";

  // 2. Menu déroulant 1 : Compétence travaillée
  const compSelect = document.createElement("select");
  compSelect.className = "fwb-select comp-select";
  compSelect.title = "Sélectionnez la compétence travaillée";

  const defaultCompOpt = document.createElement("option");
  defaultCompOpt.value = "";
  defaultCompOpt.textContent = "🎯 1. Choisir compétence FWB...";
  compSelect.appendChild(defaultCompOpt);

  Object.keys(FWB_DATABASE).forEach(sKey => {
    const sub = FWB_DATABASE[sKey];
    const group = document.createElement("optgroup");
    group.label = `${sub.icon} ${sub.name}`;

    sub.competencies.forEach(comp => {
      const opt = document.createElement("option");
      opt.value = comp.id;
      opt.textContent = `${sub.icon} ${comp.name}`;
      if (cellData.compId === comp.id) {
        opt.selected = true;
      }
      group.appendChild(opt);
    });

    compSelect.appendChild(group);
  });

  dropdownGroup.appendChild(compSelect);

  // 3. Menu déroulant 2 : Attendu d'apprentissage travaillé
  const attenduSelect = document.createElement("select");
  attenduSelect.className = "fwb-select attendu-select";
  attenduSelect.title = "Sélectionnez l'attendu officiel FWB";

  function populateAttendus(compId, selectedAttenduText) {
    attenduSelect.innerHTML = "";
    const comp = COMP_MAP[compId];

    if (!comp) {
      attenduSelect.disabled = true;
      const opt = document.createElement("option");
      opt.value = "";
      opt.textContent = "📌 2. Choisir d'abord la compétence";
      attenduSelect.appendChild(opt);
      return;
    }

    attenduSelect.disabled = false;
    const defaultAttOpt = document.createElement("option");
    defaultAttOpt.value = "";
    defaultAttOpt.textContent = `📌 2. Choisir attendu (${comp.attendus.length} disp.)...`;
    attenduSelect.appendChild(defaultAttOpt);

    let matchFound = false;
    comp.attendus.forEach(att => {
      if (currentCycleFilter !== "all" && att.cycle !== currentCycleFilter) {
        return;
      }

      const opt = document.createElement("option");
      opt.value = att.text;
      opt.textContent = `[${att.cycle}] ${att.text}`;
      if (selectedAttenduText && selectedAttenduText === att.text) {
        opt.selected = true;
        matchFound = true;
      }
      attenduSelect.appendChild(opt);
    });

    if (selectedAttenduText && !matchFound) {
      const opt = document.createElement("option");
      opt.value = selectedAttenduText;
      opt.textContent = `[Actuel] ${selectedAttenduText}`;
      opt.selected = true;
      attenduSelect.appendChild(opt);
    }
  }

  // Initial population
  populateAttendus(cellData.compId, cellData.attenduText);

  // Event handlers
  compSelect.addEventListener("change", (e) => {
    const newCompId = e.target.value;
    cellData.compId = newCompId;
    cellData.attenduText = "";

    // If user has not set a custom background yet, auto-suggest the discipline pastel color!
    if (!cellData.bg && newCompId) {
      const comp = COMP_MAP[newCompId];
      if (comp) {
        const defaultBgs = {
          math: "#EFF6FF",
          fr: "#F0FDF4",
          sci: "#ECFEFF",
          hist: "#FFFBEB",
          eco: "#F5F3FF",
          fmttn: "#FDF2F8",
          other: "#F8FAFC"
        };
        cellData.bg = defaultBgs[comp.subjectKey] || "";
        container.style.backgroundColor = cellData.bg;
      }
    }

    populateAttendus(newCompId, "");
    saveData();
  });

  attenduSelect.addEventListener("change", (e) => {
    cellData.attenduText = e.target.value;
    saveData();
  });

  dropdownGroup.appendChild(attenduSelect);
  container.appendChild(dropdownGroup);

  // Cell footer actions (Palette bouton + Fixe + Vider)
  const footer = document.createElement("div");
  footer.className = "cell-footer";
  footer.innerHTML = `
    <div class="cell-action-group">
      <button class="cell-btn color-trigger-btn" title="Changer la couleur du fond et du texte" onclick="openColorPopover(event, ${rIdx}, ${cIdx})">🎨 Couleurs</button>
      <button class="cell-btn" title="Transformer en bloc fixe (Gym, Allemand...)" onclick="promptSetPreset(${rIdx}, ${cIdx})">📌 Fixe</button>
    </div>
    <button class="cell-btn clear-btn" title="Réinitialiser la période" onclick="clearCourseCell(${rIdx}, ${cIdx})">↺ Vider</button>
  `;
  container.appendChild(footer);

  return container;
}

// =========================================================================
// 4. GESTION DE LA PALETTE DE COULEURS FLOTTANTE
// =========================================================================
function openColorPopover(event, rIdx, cIdx) {
  event.stopPropagation();
  popoverTarget = { rIdx, cIdx };
  
  const popover = document.getElementById("horaire-color-popover");
  const triggerBtn = event.currentTarget;
  const rect = triggerBtn.getBoundingClientRect();
  const containerRect = document.getElementById("schedule-container").getBoundingClientRect();

  // Show popover to calculate dimension
  popover.style.display = "flex";

  // Calculate position relative to container
  let top = rect.bottom - containerRect.top + 6;
  let left = rect.left - containerRect.left;

  // Adjust if overflow
  if (left + 230 > containerRect.width) {
    left = Math.max(10, containerRect.width - 240);
  }

  popover.style.top = `${top}px`;
  popover.style.left = `${left}px`;
}

function closeColorPopover() {
  const popover = document.getElementById("horaire-color-popover");
  if (popover) popover.style.display = "none";
  popoverTarget = null;
}

function applyPopoverBg(color) {
  if (!popoverTarget) return;
  const currentWeek = getActiveWeek();
  const cell = currentWeek.grid[popoverTarget.rIdx][popoverTarget.cIdx];
  cell.bg = color;
  saveData();
  renderSchedule();
  closeColorPopover();
}

function applyPopoverTextColor(color) {
  if (!popoverTarget) return;
  const currentWeek = getActiveWeek();
  const cell = currentWeek.grid[popoverTarget.rIdx][popoverTarget.cIdx];
  cell.textColor = color;
  saveData();
  renderSchedule();
  closeColorPopover();
}

// =========================================================================
// 5. GESTION DES CELLULES & PRESETS
// =========================================================================
function clearCourseCell(rIdx, cIdx) {
  const currentWeek = getActiveWeek();
  currentWeek.grid[rIdx][cIdx] = {
    type: "course",
    activity: "",
    compId: "",
    attenduText: "",
    bg: "",
    textColor: ""
  };
  saveData();
  renderSchedule();
}

function convertToCourseSlot(rIdx, cIdx) {
  clearCourseCell(rIdx, cIdx);
}

function promptSetPreset(rIdx, cIdx) {
  const label = prompt("Intitulé du bloc fixe (ex : Allemand, GYM, Natation, Sortie) :");
  if (label && label.trim()) {
    const currentWeek = getActiveWeek();
    currentWeek.grid[rIdx][cIdx] = {
      type: "preset",
      presetType: "libre",
      label: label.trim(),
      bg: "#F1F5F9",
      textColor: "#334155"
    };
    saveData();
    renderSchedule();
  }
}

// =========================================================================
// 6. GESTION DES SEMAINES (Créer depuis Modèle, Dupliquer, Renommer, Supprimer)
// =========================================================================
function createNewWeek() {
  const suggestedTitle = getNextMondayString();
  const title = prompt("Titre de la nouvelle semaine (créée à partir du modèle) :", suggestedTitle);
  if (!title || !title.trim()) return;

  const template = getTemplateWeek();
  const newWeek = {
    id: "week_" + Date.now(),
    isTemplate: false,
    title: title.trim(),
    created: new Date().toISOString(),
    // Clone la grille du modèle avec toutes ses heures de fourche et matières fixes
    grid: JSON.parse(JSON.stringify(template.grid))
  };

  allWeeks.push(newWeek);
  activeWeekId = newWeek.id;
  saveData();
  renderWeekSelector();
  renderSchedule();
}

function duplicateCurrentWeek() {
  const cur = getActiveWeek();
  const title = prompt("Titre de la copie :", cur.title + " (Copie)");
  if (!title || !title.trim()) return;

  const newWeek = JSON.parse(JSON.stringify(cur));
  newWeek.id = "week_" + Date.now();
  newWeek.isTemplate = false;
  newWeek.title = title.trim();
  newWeek.created = new Date().toISOString();

  allWeeks.push(newWeek);
  activeWeekId = newWeek.id;
  saveData();
  renderWeekSelector();
  renderSchedule();
}

function renameCurrentWeek() {
  const cur = getActiveWeek();
  const title = prompt("Nouveau nom pour cette semaine :", cur.title);
  if (!title || !title.trim()) return;

  cur.title = title.trim();
  saveData();
  renderWeekSelector();
}

function deleteCurrentWeek() {
  const cur = getActiveWeek();
  if (cur.isTemplate) {
    alert("⚠️ La Grille Modèle ne peut pas être supprimée car elle sert de canevas de base permanent pour générer toutes vos nouvelles semaines.");
    return;
  }
  
  if (confirm(`Voulez-vous vraiment supprimer "${cur.title}" ?`)) {
    allWeeks = allWeeks.filter(w => w.id !== activeWeekId);
    activeWeekId = allWeeks[0].id;
    saveData();
    renderWeekSelector();
    renderSchedule();
  }
}

// =========================================================================
// 7. EXPORT / IMPORT JSON
// =========================================================================
function exportDataJSON() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allWeeks, null, 2));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", dataStr);
  downloadAnchor.setAttribute("download", `semainier_tbi_fwb_${new Date().toISOString().slice(0,10)}.json`);
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();
}

function importDataJSON(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const parsed = JSON.parse(e.target.result);
      if (Array.isArray(parsed) && parsed.length > 0) {
        allWeeks = parsed;
        activeWeekId = allWeeks[0].id;
        saveData();
        renderWeekSelector();
        renderSchedule();
        alert("Importation réussie !");
      } else {
        alert("Format de fichier JSON invalide.");
      }
    } catch (err) {
      alert("Erreur lors de la lecture du fichier JSON.");
    }
  };
  reader.readAsText(file);
}
